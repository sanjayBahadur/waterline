[project]
name = "waterline"
version = "0.1.0"
description = "Flood extent segmentation from Sentinel-1 SAR imagery with terrain priors"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # modeling
    "torch>=2.4",
    "torchvision>=0.19",
    "lightning>=2.4",
    "torchgeo>=0.9",
    "segmentation-models-pytorch>=0.3",
    "transformers>=4.44",          # SegFormer
    # geospatial
    "rasterio>=1.3",
    "rioxarray>=0.17",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    # STAC access
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3",
    # terrain derivatives
    "pysheds>=0.3",
    # config / tracking
    "hydra-core>=1.3",
    "wandb>=0.17",
    # analytics
    "duckdb>=1.0",
    "pandas>=2.2",
    # export / serving
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "fastapi>=0.115",
    # plotting
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/waterline"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
ignore_missing_imports = true      # most geo libs ship no stubs
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: requires GPU or full dataset; excluded from CI",
]
