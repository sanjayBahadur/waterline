name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    # This is a ceiling to catch a genuinely hung job, not the target
    # duration. CLAUDE.md's "under 5 minutes" is a steady-state target
    # with a warm dependency cache; a cold install of this stack (torch,
    # torchgeo, rasterio, geopandas, onnxruntime, ...) can legitimately
    # take longer the first time a cache is missed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock is committed yet, so key the cache off pyproject.toml
          # instead of the default **/uv.lock glob (which errors when no
          # lockfile exists). Revisit once M6's reproducibility pass adds one.
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

      # TODO(M1): add a smoke training run on a fixture subset (one batch,
      # a few steps) so broken training code fails here rather than on a
      # rented GPU. See CLAUDE.md "Engineering conventions" and the
      # "CI pipeline" issue under milestone M1.
